policy_node:
  ros__parameters:
    # Robot configuration
    robot_type: "franka"
    input_dof: 9           # Franka: 7 arm + 2 fingers
    libero_dof: 8          # LIBERO format for Pi0 server
    
    # ROS topics - input
    joint_state_topic: "/isaac_joint_states"
    env_camera_topic: "/env_perspective"
    wrist_camera_topic: "/wrist_perspective"
    
    # ROS topics - output (Isaac Sim IK will subscribe to these)
    ee_delta_topic: "/franka/ee_delta_command"
    gripper_topic: "/franka/gripper_command"
    
    # Image processing
    width: 224
    height: 224
    
    # Policy server
    policy_server_url: "http://localhost:8000/predict"
    task_description: "Pick up the object"
    
    # Control parameters
    control_frequency: 10.0
    action_scale: 0.1      # Scale factor for EE deltas (reduced to prevent extreme movements)
