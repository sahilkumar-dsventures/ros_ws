policy_node:
  ros__parameters:
    joint_state_topic: "/isaac_joint_states"
    env_camera_topic: "/env_perspective"
    wrist_camera_topic: "/wrist_perspective"
    width: 224
    height: 224
    policy_server_url: "http://localhost:8000/predict"
    # Pi0 outputs Cartesian EE deltas - publish raw deltas for Isaac Sim IK solver
    ee_delta_topic: "/ee_delta_command"      # Twist: linear=[dx,dy,dz], angular=[roll,pitch,yaw]
    gripper_topic: "/gripper_command"        # Float64: -1 (close) to +1 (open)
    control_frequency: 10.0
    action_scale: 1.0  # Scale factor for EE deltas
    task_description: "Pick up the object"   # Task instruction sent to Pi0 policy

