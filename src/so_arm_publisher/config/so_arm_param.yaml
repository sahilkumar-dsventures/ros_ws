policy_node:
  ros__parameters:
    joint_state_topic: "/isaac_joint_states"
    env_camera_topic: "/env_perspective"
    wrist_camera_topic: "/wrist_perspective"
    width: 224
    height: 224
    policy_server_url: "http://localhost:8000/predict"
    # Pi0 outputs Cartesian EE deltas - publish to these topics for Isaac Sim
    publish_topic: "/ee_delta_command"     # Twist message with [dx, dy, dz, droll, dpitch, dyaw]
    gripper_topic: "/gripper_command"      # Float64MultiArray with [finger1, finger2]
    control_frequency: 10.0
    action_scale: 1.0  # Scale factor for action deltas (increase if movements are too small)
    task_description: "Pick up the rubic cube and put it inside the box"  # Task instruction sent to Pi0 policy
